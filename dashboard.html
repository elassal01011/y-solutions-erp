<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Y SOLUTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar">
    <div class="text-center p-3">
        <h4 style="color: #c5a059;">Y SOLUTIONS</h4>
        <span id="userBadge" class="badge bg-primary">ROLE</span>
    </div>
    <hr style="background-color: white;">
    <nav id="sideMenu" class="nav flex-column"></nav>
    <div class="p-3 mt-auto">
        <button class="btn btn-outline-danger w-100" onclick="logout()">Logout</button>
    </div>
</div>

    <div class="main-content">
        <div class="topbar"><h2>Overview</h2></div>
        <div class="row g-4 mt-2">
            <div class="col-md-4">
                <div class="stat-card">
                    <h5>Total Stock Value</h5>
                    <h2 id="total-val">Loading...</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <h5>Active Projects</h5>
                    <h2 id="proj-count">31</h2>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
