<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Y SOLUTIONS ERP</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">

        <img src="https://i.imgur.com/Q5oJXGx.png">

        <div class="role-badge">
            MANAGEMENT
        </div>

    </div>

    <div class="menu">

        <a href="#">
            <i class="fa-solid fa-chart-column"></i>
            Dashboard
        </a>

        <a href="#">
            <i class="fa-solid fa-file-invoice"></i>
            Quotations
        </a>

        <a href="#">
            <i class="fa-solid fa-warehouse"></i>
            Warehouse
        </a>

        <a href="#">
            <i class="fa-solid fa-users"></i>
            Employees
        </a>

    </div>

    <button class="logout-btn">
        Logout
    </button>

</div>

<!-- MAIN -->

<div class="main">

    <div class="topbar">

        <h1>Enterprise Dashboard</h1>

        <i class="fa-solid fa-bars fa-2x"></i>

    </div>

    <!-- IMAGE GRID -->

    <div class="dashboard-grid">

        <div class="glass-card">
            <img src="https://images.unsplash.com/photo-1558002038-1055907df827?q=80&w=1200&auto=format&fit=crop">
        </div>

        <div class="glass-card">
            <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop">
        </div>

    </div>

    <!-- BIG BANNER -->

    <div class="glass-card banner">

        <img src="https://images.unsplash.com/photo-1558002038-1055907df827?q=80&w=1200&auto=format&fit=crop">

    </div>

    <!-- STATS -->

    <div class="stats">

        <div class="stat-box">
            <h2>31</h2>
            <p>Active Projects</p>
        </div>

        <div class="stat-box">
            <h2>14</h2>
            <p>Employees</p>
        </div>

        <div class="stat-box">
            <h2>420K</h2>
            <p>Total Revenue</p>
        </div>

        <div class="stat-box">
            <h2>8</h2>
            <p>Maintenance Tasks</p>
        </div>

    </div>

</div>

</body>
</html>
