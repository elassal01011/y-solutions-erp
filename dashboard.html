<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="sidebar glass-card">

<div class="logo-section">
<img src="https://i.imgur.com/Q5oJXGx.png" class="logo">

<div class="role-badge">
MANAGEMENT
</div>
</div>

<div class="menu">

<a href="dashboard.html">
<i class="fa-solid fa-chart-line"></i>
Dashboard
</a>

<a href="quotations.html">
<i class="fa-solid fa-file-invoice"></i>
Quotations
</a>

<a href="warehouse.html">
<i class="fa-solid fa-warehouse"></i>
Warehouse
</a>

<a href="employees.html">
<i class="fa-solid fa-users"></i>
Employees
</a>

<a href="maintenance.html">
<i class="fa-solid fa-screwdriver-wrench"></i>
Maintenance
</a>

<a href="finance.html">
<i class="fa-solid fa-money-bill"></i>
Finance
</a>

</div>

<button class="logout-btn" onclick="logout()">
Logout
</button>

</div>

<div class="main-content">

<div class="topbar">
<h1>Enterprise Dashboard</h1>
<div class="top-icons">
<i class="fa-solid fa-bell"></i>
<i class="fa-solid fa-user"></i>
</div>
</div>

<div class="dashboard-grid">

<div class="glass-card image-card">
<img src="https://images.unsplash.com/photo-1558002038-1055907df827?q=80&w=1200&auto=format&fit=crop">
</div>

<div class="glass-card image-card">
<img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop">
</div>

</div>

<div class="glass-card banner-card">
<img src="https://images.unsplash.com/photo-1558002038-1055907df827?q=80&w=1200&auto=format&fit=crop">
</div>

<div class="stats-grid">

<div class="stat-box glass-card">
<h2>420K</h2>
<p>Total Revenue</p>
</div>

<div class="stat-box glass-card">
<h2>31</h2>
<p>Projects</p>
</div>

<div class="stat-box glass-card">
<h2>14</h2>
<p>Employees</p>
</div>

<div class="stat-box glass-card">
<h2>8</h2>
<p>Maintenance</p>
</div>

</div>

<div class="chart-section glass-card">
<canvas id="salesChart"></canvas>
</div>

</div>

<script>
const ctx = document.getElementById('salesChart');

new Chart(ctx, {
    type: 'line',
    data: {
        labels: ['Jan','Feb','Mar','Apr','May','Jun'],
        datasets: [{
            label: 'Revenue',
            data: [12000,25000,18000,32000,45000,60000],
            tension:0.4
        }]
    }
});
</script>

</body>
</html>
