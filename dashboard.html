<!DOCTYPE html>
<div class="main-content">

<div class="topbar">
<h1>Enterprise Dashboard</h1>

<div class="top-icons">

<button id="themeToggle" class="theme-btn">
<i class="fa-solid fa-moon"></i>
</button>

<button class="theme-btn mobile-btn" onclick="toggleSidebar()">
<i class="fa-solid fa-bars"></i>
</button>

</div>

</div>

<div class="dashboard-grid">

<div class="glass-card image-card">
<img src="https://images.unsplash.com/photo-1558002038-1055907df827?q=80&w=1200&auto=format&fit=crop">
</div>

<div class="glass-card image-card">
<img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop">
</div>

</div>

<div class="glass-card banner-card">
<img src="https://images.unsplash.com/photo-1558002038-1055907df827?q=80&w=1200&auto=format&fit=crop">
</div>

<div class="stats-grid">

<div class="stat-box glass-card">
<h2 id="revenue">420K</h2>
<p>Total Revenue</p>
</div>

<div class="stat-box glass-card">
<h2>31</h2>
<p>Projects</p>
</div>

<div class="stat-box glass-card">
<h2>14</h2>
<p>Employees</p>
</div>

<div class="stat-box glass-card">
<h2>8</h2>
<p>Maintenance</p>
</div>

</div>

<div class="chart-section glass-card">
<canvas id="salesChart"></canvas>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script src="firebase/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>

</body>
</html>
