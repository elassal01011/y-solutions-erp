<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Executive Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
   <script src="firebase/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/dashboard.js"></script>
</head>
<body style="display:none;">
    <div class="sidebar" id="sidebar-container"></div>
    <div class="main-wrapper">
        <div class="module-container">
            <h3>Executive Operations Dashboard</h3>
            <div class="stats-grid">
                <div class="stat-card"><small>Gross Dataset Revenue</small><p>3,905,747 EGP</p></div>
                <div class="stat-card profit-card"><small>Net Revenue Profit</small><p>1,029,876 EGP</p></div>
            </div>
            <h4>Monthly Financial Trajectory</h4>
            <div class="table-container">
                <table>
                    <thead><tr><th>Fiscal Month</th><th>Completed Contracts</th><th>Invoiced Yield</th><th>Net Margin</th></tr></thead>
                    <tbody id="revenue-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
