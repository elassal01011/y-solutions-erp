<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar">
    <h2>Y SOLUTIONS</h2>

    <a href="dashboard.html">Dashboard</a>
    <a href="quotation.html">Quotation</a>
    <a href="operations.html">Operations</a>
    <a href="warehouse.html">Warehouse</a>
    <a href="employees.html">Employees</a>

    <button id="logoutBtn">Logout</button>
</div>

<div class="main">

    <div class="grid">

        <div class="card">
            <h3>Total Orders</h3>
            <h1 id="totalOrders">0</h1>
        </div>

        <div class="card">
            <h3>Pending Projects</h3>
            <h1 id="pendingProjects">0</h1>
        </div>

        <div class="card">
            <h3>Total Employees</h3>
            <h1 id="totalEmployees">0</h1>
        </div>

    </div>

    <div class="card">
        <h2>Recent Orders</h2>

        <table>
            <thead>
                <tr>
                    <th>Client</th>
                    <th>Status</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
        </table>

    </div>

</div>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
