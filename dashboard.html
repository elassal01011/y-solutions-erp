<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="sidebar">
    <h3>Y SOLUTIONS</h3>

    <a href="#">Dashboard</a>
    <a href="#">Quotations</a>
    <a href="#">Warehouse</a>
    <a href="#">Projects</a>
    <a href="#">Employees</a>
    <a href="#">Finance</a>
    <a href="#">Maintenance</a>
</div>

<div class="main-content">

    <div class="topbar">
        <h2>Enterprise Dashboard</h2>
    </div>

    <div class="row g-4 mt-3">

        <div class="col-md-3">
            <div class="stat-card">
                <h5>Total Revenue</h5>
                <h2>420,000 EGP</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="stat-card">
                <h5>Projects</h5>
                <h2>31</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="stat-card">
                <h5>Employees</h5>
                <h2>14</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="stat-card">
                <h5>Warehouse Alerts</h5>
                <h2>4</h2>
            </div>
        </div>

    </div>

    <div class="card mt-5 p-4">
        <canvas id="salesChart"></canvas>
    </div>

</div>

<script>
const ctx = document.getElementById('salesChart');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Jan','Feb','Mar','Apr','May'],
        datasets: [{
            label: 'Revenue',
            data: [12000,19000,30000,50000,42000]
        }]
    }
});
</script>

</body>
</html>
