<!DOCTYPE html>
</head>
<body>

<div class="sidebar">
<h2>Employees</h2>
</div>

<div class="main">

<div class="card">

<h2>Staff Accounts</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Role</th>
</tr>
</thead>
<tbody id="employeesTable"></tbody>
</table>

</div>

</div>

<script type="module">

import { db } from './js/config.js';

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const table = document.getElementById('employeesTable');

async function load(){

const snapshot = await getDocs(collection(db,'users'));

snapshot.forEach((doc)=>{

const data = doc.data();

 table.innerHTML += `
 <tr>
 <td>${data.name}</td>
 <td>${data.email}</td>
 <td>${data.role}</td>
 </tr>
 `;

});

}

load();

</script>

</body>
</html>
