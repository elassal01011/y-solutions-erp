<!DOCTYPE html>
<html>
<head>
    <title>Warehouse</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar">
    <h2>Warehouse</h2>
</div>

<div class="main">

<div class="card">

<h2>Add Item</h2>

<input type="text" id="itemName" placeholder="Item Name">
<input type="number" id="itemPrice" placeholder="Price">
<input type="number" id="itemQty" placeholder="Quantity">

<button id="saveItem">Save Item</button>

</div>

<div class="card">

<table>
<thead>
<tr>
<th>Item</th>
<th>Price</th>
<th>Quantity</th>
</tr>
</thead>
<tbody id="warehouseTable"></tbody>
</table>

</div>

</div>

<script type="module" src="js/warehouse.js"></script>
</body>
</html>
