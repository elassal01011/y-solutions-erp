<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse - Y SOLUTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar">
    <div class="text-center p-3">
        <h4 style="color: #c5a059;">Y SOLUTIONS</h4>
        <span id="userBadge" class="badge bg-primary">ROLE</span>
    </div>
    <hr style="background-color: white;">
    <nav id="sideMenu" class="nav flex-column"></nav>
    <div class="p-3 mt-auto">
        <button class="btn btn-outline-danger w-100" onclick="logout()">Logout</button>
    </div>
</div>

<div class="main-content">
    <div class="topbar d-flex justify-content-between align-items-center">
        <h2>Warehouse Management</h2>
        <button class="btn btn-warning fw-bold" data-bs-toggle="modal" data-bs-target="#addItemModal">+ Add New Item</button>
    </div>

    <div class="card p-4 mt-4 shadow-sm">
        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Item Name</th>
                    <th>Stock Level</th>
                    <th>Price (EGP)</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="warehouseTable">
                </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="addItemModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">New Inventory Item</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="itemName" class="form-control mb-3" placeholder="Item Name">
                <input type="number" id="itemStock" class="form-control mb-3" placeholder="Current Stock">
                <input type="number" id="itemPrice" class="form-control mb-3" placeholder="Price per Unit">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-warning" onclick="addNewItem()">Save Item</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase/config.js"></script>
<script src="js/warehouse.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
