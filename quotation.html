<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotations - Y SOLUTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
    <div class="p-4 text-center border-bottom border-secondary mb-3">
        <h4 class="fw-bold" style="color:#c5a059">Y SOLUTIONS</h4>
        <span id="userBadge" class="badge bg-secondary">ROLE</span>
    </div>

    <nav class="nav flex-column" id="sideMenu"></nav>

    <div class="mt-auto p-4 border-top border-secondary">
        <button class="btn btn-outline-danger w-100 btn-sm" onclick="logout()">Logout</button>
    </div>
</div>
    <div class="main-content">
        <div class="topbar d-flex justify-content-between align-items-center">
            <h2>Quotations Management</h2>
            <button class="btn btn-warning fw-bold" data-bs-toggle="modal" data-bs-target="#quoteModal">+ New Quotation</button>
        </div>

        <div class="card p-4 mt-4">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Client Name</th>
                        <th>Total Amount</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="quotationTable">
                    </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="quoteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5>Create New Quotation</h5></div>
                <div class="modal-body">
                    <input type="text" id="clientName" class="form-control mb-2" placeholder="Client Name">
                    <input type="number" id="totalAmount" class="form-control mb-2" placeholder="Total Amount (EGP)">
                    <select id="quoteStatus" class="form-select">
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Sent">Sent</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button class="btn btn-warning" onclick="saveQuotation()">Save Quotation</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase/config.js"></script>
    <script src="js/quotation.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
