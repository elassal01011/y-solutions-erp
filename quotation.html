<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Quotation Workspace</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/quotation.js"></script>
</head>
<body style="display:none;">
    <div class="sidebar" id="sidebar-container"></div>
    <div class="main-wrapper">
        <div class="module-container">
            <h3>Professional Automated Invoice Construction</h3>
            <div class="form-group-grid">
                <div><label>Client Reference Identity</label><input type="text" id="client-name" placeholder="Client Name"></div>
                <div><label>Logistics Zone (Calculates Delivery)</label>
                    <select id="client-city">
                        <option value="Cairo">Cairo (200 EGP)</option><option value="Giza">Giza (200 EGP)</option>
                        <option value="Alexandria">Alexandria (300 EGP)</option><option value="New Capital">New Capital (400 EGP)</option>
                    </select>
                </div>
            </div>
            <div class="box-panel">
                <h4>Inject Core Asset Allocation Set Node</h4>
                <div style="display:flex; gap:15px; margin-top:10px;">
                    <select id="product-select" style="flex:2;"></select>
                    <input type="number" id="product-qty" value="1" min="1" style="flex:0.5;">
                    <button onclick="appendProductToQuote()" class="btn-primary" style="flex:0.5;">Add Item</button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead><tr><th>Product Specs</th><th>Brand</th><th>Unit Cost</th><th>Qty</th><th>Subtotal</th></tr></thead>
                    <tbody id="quote-items-body"></tbody>
                </table>
            </div>
            <div class="quote-totals">
                <p>Items Subtotal: <span id="txt-subtotal">0.00</span> EGP</p>
                <p>Installation Architecture Fee (15%): <span id="txt-install">0.00</span> EGP</p>
                <p>Logistics Delivery: <span id="txt-delivery">0.00</span> EGP</p>
                <p>Government Tax Layer (14% VAT): <span id="txt-vat">0.00</span> EGP</p>
                <hr><h3 style="margin-top:5px;">Grand Total Due: <span id="txt-grand">0.00</span> EGP</h3><br>
                <button onclick="finalizeOrder()" class="btn-primary">Commit Configuration to Vault</button>
            </div>
        </div>
    </div>
</body>
</html>
