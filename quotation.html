<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotations - Y SOLUTIONS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar no-print">
        <div class="text-center p-3">
            <h4 style="color: #c5a059;">Y SOLUTIONS</h4>
            <span id="userBadge" class="badge bg-primary">ROLE</span>
        </div>
        <hr style="background-color: white;">
        <nav id="sideMenu" class="nav flex-column"></nav>
        <div class="p-3 mt-auto">
            <button class="btn btn-outline-danger w-100" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar d-flex justify-content-between align-items-center">
            <h2>Quotations Management</h2>
            <button class="btn btn-warning fw-bold" data-bs-toggle="modal" data-bs-target="#quoteModal">+ New Quotation</button>
        </div>

        <div class="card p-4 mt-4">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Client Name</th>
                        <th>Total Amount</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="quotationTable">
                    </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="quoteModal" tabindex="-1">
        <div class="modal-dialog modal-lg"> <div class="modal-content">
                <div class="modal-header">
                    <h5 class="fw-bold">Create Professional Quotation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="small fw-bold">Client Name</label>
                            <input type="text" id="cName" class="form-control" placeholder="Enter name">
                        </div>
                        <div class="col-md-6">
                            <label class="small fw-bold">Client Phone</label>
                            <input type="text" id="cPhone" class="form-control" placeholder="Enter phone">
                        </div>
                    </div>

                    <h6 class="border-bottom pb-2 mb-3 fw-bold text-primary">Hardware Selection</h6>
                    
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="small">Smart Switch (1050 EGP)</label>
                            <input type="number" class="form-control device-qty" data-name="Smart Switch" data-price="1050" value="0" oninput="calcQuotation()">
                        </div>
                        <div class="col-6">
                            <label class="small">Smart Camera (2400 EGP)</label>
                            <input type="number" class="form-control device-qty" data-name="Smart Camera" data-price="2400" value="0" oninput="calcQuotation()">
                        </div>
                        <div class="col-6">
                            <label class="small">Motion Sensor (850 EGP)</label>
                            <input type="number" class="form-control device-qty" data-name="Motion Sensor" data-price="850" value="0" oninput="calcQuotation()">
                        </div>
                        <div class="col-6">
                            <label class="small">Smart Lock (5500 EGP)</label>
                            <input type="number" class="form-control device-qty" data-name="Smart Lock" data-price="5500" value="0" oninput="calcQuotation()">
                        </div>
                    </div>

                    <div id="quotationOutput" class="mt-4"></div>

                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button class="btn btn-warning fw-bold" onclick="saveQuotation()">Save & Sync to Ops</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase/config.js"></script>
    <script src="js/quotation.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
