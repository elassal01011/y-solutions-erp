<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Y-Solutions Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="js/config.js"></script>
</head>
<body class="auth-page">
    <div class="login-box">
        <h2>Y-Solutions ERP</h2>
        <p style="color:#7f8c8d; font-size:0.85em; margin-bottom:15px;">System Security Gateway</p>
        <input type="email" id="login-email" placeholder="Staff Email Address">
        <input type="password" id="login-pass" placeholder="Password Metric Verification">
        <button onclick="executeLogin()" class="btn-primary" style="width:100%;">Authenticate Session</button>
        <p id="err-log" class="error"></p>
    </div>
    <script>
        function executeLogin() {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            auth.signInWithEmailAndPassword(e, p)
                .then(() => window.location.href="dashboard.html")
                .catch(err => document.getElementById('err-log').innerText = err.message);
        }
    </script>
</body>
</html>
