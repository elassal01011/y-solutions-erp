<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Y SOLUTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h1 class="text-center">Y SOLUTIONS</h1>
        <p class="text-center text-muted">Enterprise Management System</p>
        <div class="mt-4">
            <input type="email" id="email" class="form-control mb-3" placeholder="Company Email">
            <input type="password" id="password" class="form-control mb-3" placeholder="Password">
            <button class="btn btn-warning w-100 fw-bold" onclick="login()">LOGIN</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="firebase/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
