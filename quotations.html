<!DOCTYPE html>
<html>
<head>
    <title>Quotation System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar">
    <h2>Quotation</h2>

    <a href="dashboard.html">Dashboard</a>
    <a href="quotation.html">Quotation</a>
</div>

<div class="main">

<div class="card">

<h2>Create New Order</h2>

<input type="text" id="clientName" placeholder="Client Name">
<input type="text" id="clientPhone" placeholder="Phone">
<input type="text" id="clientCity" placeholder="City">

<select id="items"></select>
<input type="number" id="qty" placeholder="Quantity">

<input type="number" id="vat" placeholder="VAT %" value="14">
<input type="number" id="installation" placeholder="Installation Cost">

<button id="addItem">Add Item</button>

<table>
<thead>
<tr>
<th>Item</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
</tr>
</thead>
<tbody id="quotationTable"></tbody>
</table>

<h2 id="grandTotal">0 EGP</h2>

<button id="saveQuotation">Save Quotation</button>
<button onclick="window.print()">Print</button>

</div>

</div>

<script type="module" src="js/quotation.js"></script>
</body>
</html>
