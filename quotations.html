<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotations - Y SOLUTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="text-center p-3">
            <h4 style="color: #c5a059;">Y SOLUTIONS</h4>
            <span id="userBadge" class="badge bg-primary">ROLE</span>
        </div>
        <hr style="background-color: white;">
        <nav id="sideMenu" class="nav flex-column"></nav>
        <div class="p-3 mt-auto">
            <button class="btn btn-outline-danger w-100" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar d-flex justify-content-between align-items-center">
            <h2>Quotations Management</h2>
            <button class="btn btn-warning fw-bold" data-bs-toggle="modal" data-bs-target="#quoteModal">+ New Quotation</button>
        </div>

        <div class="card p-4 mt-4">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Client Name</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="quotationTable"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="quoteModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5>New Smart Home Quote</h5></div>
                <div class="modal-body">
                    <input type="text" id="cName" class="form-control mb-3" placeholder="Client Name">
                    <h6>Hardware Selection</h6>
                    <div class="row g-2">
                        <div class="col-6">
                            <label>Smart Switch (1050 EGP)</label>
                            <input type="number" class="form-control device-qty" data-name="Smart Switch" data-price="1050" value="0" oninput="calcQuotation()">
                        </div>
                        <div class="col-6">
                            <label>Smart Camera (2400 EGP)</label>
                            <input type="number" class="form-control device-qty" data-name="Smart Camera" data-price="2400" value="0" oninput="calcQuotation()">
                        </div>
                    </div>
                    <div id="quotationOutput" class="mt-3"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-warning w-100" onclick="saveQuotation()">Save Quotation</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/quotation.js"></script>
</body>
</html>
