<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Operations - Y SOLUTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar"><nav id="sideMenu"></nav></div> <div class="main-content">
        <h2>Project Pipeline</h2>
        <div class="card p-4 mt-4">
            <table class="table align-middle">
                <thead class="table-dark">
                    <tr><th>Project ID</th><th>Client</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="opsTable"></tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Load projects that are NOT finished
        db.collection("quotations").onSnapshot(snapshot => {
            const table = document.getElementById('opsTable');
            table.innerHTML = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                if(data.status === 'Finished') return;

                table.innerHTML += `
                    <tr>
                        <td>${doc.id.substring(0,5)}</td>
                        <td>${data.clientName}</td>
                        <td><span class="badge bg-info">${data.status}</span></td>
                        <td>
                            <select class="form-select form-select-sm" onchange="updateStatus('${doc.id}', this.value)">
                                <option value="Pending" ${data.status==='Pending'?'selected':''}>Pending</option>
                                <option value="On Work" ${data.status==='On Work'?'selected':''}>On Work</option>
                                <option value="Finished">Mark as Finished</option>
                            </select>
                        </td>
                    </tr>`;
            });
        });

        async function updateStatus(id, newStatus) {
            await db.collection("quotations").doc(id).update({ status: newStatus });
            alert("Project updated to " + newStatus);
        }
        // Load only "Approved" or "Pending" projects
db.collection("quotations").onSnapshot(snap => {
    const container = document.getElementById('opsTable');
    if(!container) return;
    container.innerHTML = '';
    snap.forEach(doc => {
        const d = doc.data();
        container.innerHTML += `
            <tr>
                <td>${d.clientName}</td>
                <td>${d.status}</td>
                <td>
                    <button class="btn btn-success btn-sm" onclick='deployProject("${doc.id}", ${JSON.stringify(d.items)})'>
                        Deploy & Deduct Stock
                    </button>
                </td>
            </tr>`;
    });
});

async function deployProject(id, items) {
    if(!confirm("Deduct items from Warehouse and start installation?")) return;

    const batch = db.batch();
    
    // 1. Deduct from Storage
    items.forEach(item => {
        const productRef = db.collection("products").doc(item.name);
        batch.update(productRef, {
            stock: firebase.firestore.FieldValue.increment(-item.qty)
        });
    });

    // 2. Update Status
    const quoteRef = db.collection("quotations").doc(id);
    batch.update(quoteRef, { status: "Operating/In Progress" });

    try {
        await batch.commit();
        alert("Success! Storage updated and Ops started.");
    } catch (e) { alert("Stock Error: Make sure product names match exactly!"); }
}
    </script>
</body>
</html>
