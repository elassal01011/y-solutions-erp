<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Operations Management</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</head>
<body style="display:none;">
    <div class="sidebar" id="sidebar-container"></div>
    <div class="main-wrapper">
        <div class="module-container">
            <h3>Operations Logistics Realtime Terminal</h3>
            <div class="table-container">
                <table>
                    <thead><tr><th>Project ID</th><th>Region Block</th><th>Size Asset</th><th>Nodes Set</th><th>Deployment Status Matrix Link</th></tr></thead>
                    <tbody>
                        <tr><td>#101</td><td><b>Alexandria</b></td><td>225 m²</td><td>23 Nodes</td><td>
                            <select onchange="updateFirebaseStatus(101, this.value)"><option>Pending</option><option selected>In Work</option><option>Finished</option></select>
                        </td></tr>
                        <tr><td>#102</td><td><b>New Capital</b></td><td>178 m²</td><td>18 Nodes</td><td>
                            <select onchange="updateFirebaseStatus(102, this.value)"><option>Pending</option><option selected>In Work</option><option>Finished</option></select>
                        </td></tr>
                    </tbody>
                </table>
            </div>
            <div class="box-panel" style="margin-top:20px;">
                <h4>File Dynamic Client Maintenance Servicing Ticket</h4>
                <input type="text" id="maint-target" placeholder="Client Designation Identifier Key"><br>
                <textarea id="maint-body" placeholder="Describe component structural issue report array metrics..."></textarea><br>
                <button onclick="dispatchTicket()" class="btn-primary">Broadcast Ticket Set</button>
            </div>
        </div>
    </div>
    <script>
        window.onload = () => checkAccessControl(["Manager", "Operations"]);
        function updateFirebaseStatus(id, value) {
            db.collection('project_states').doc(`project_${id}`).set({ status: value, stamped: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })
              .then(() => console.log("State updated."));
        }
        function dispatchTicket() {
            db.collection('maintenance').add({ client: document.getElementById('maint-target').value, problem: document.getElementById('maint-body').value })
              .then(() => { alert("Maintenance dispatched."); document.getElementById('maint-target').value=''; document.getElementById('maint-body').value=''; });
        }
    </script>
</body>
</html>
