<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Operations - Y SOLUTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar"><nav id="sideMenu"></nav></div> <div class="main-content">
        <h2>Project Pipeline</h2>
        <div class="card p-4 mt-4">
            <table class="table align-middle">
                <thead class="table-dark">
                    <tr><th>Project ID</th><th>Client</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="opsTable"></tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
       // --- 1. THE DATA LOADER ---
// This listens to Firestore and builds the table automatically
db.collection("quotations").onSnapshot(snapshot => {
    const table = document.getElementById('opsTable');
    if(!table) return;
    table.innerHTML = '';

    snapshot.forEach(doc => {
        const data = doc.data();
        if(data.status === 'Finished') return; // Hide completed projects

        // Prepare the items list to pass into the function
        const itemsJson = JSON.stringify(data.items || []);

        table.innerHTML += `
            <tr>
                <td>${doc.id.substring(0,5)}</td>
                <td>${data.clientName}</td>
                <td><span class="badge bg-info">${data.status}</span></td>
                <td>
                    <select class="form-select form-select-sm" 
                            onchange='handleStatusChange("${doc.id}", this.value, ${itemsJson})'>
                        <option value="Pending" ${data.status==='Pending'?'selected':''}>Pending</option>
                        <option value="On Work" ${data.status==='On Work'?'selected':''}>On Work</option>
                        <option value="Finished">Mark as Finished</option>
                    </select>
                </td>
            </tr>`;
    });
});

// --- 2. THE SMART UPDATER ---
// This handles the logic when a status is changed
async function handleStatusChange(id, newStatus, items) {
    try {
        // If status is "On Work", automatically deduct from Warehouse
        if (newStatus === "On Work") {
            const confirmStock = confirm("Are you sure? This will subtract these items from Storage inventory.");
            if (!confirmStock) {
                location.reload(); // Reset the dropdown if they cancel
                return;
            }
            await deductStock(items);
        }

        // Update the database
        await db.collection("quotations").doc(id).update({ 
            status: newStatus,
            lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("Update Successful: Project is now " + newStatus);
    } catch (error) {
        console.error("Ops Error:", error);
        alert("System Error: " + error.message);
    }
}

// --- 3. THE STORAGE LINK ---
// This speaks to the 'products' collection
async function deductStock(items) {
    const batch = db.batch();
    
    items.forEach(item => {
        // Find product by name (Document ID must match item name)
        const productRef = db.collection("products").doc(item.name);
        
        // Subtract the quantity
        batch.update(productRef, {
            stock: firebase.firestore.FieldValue.increment(-item.qty)
        });
    });

    return batch.commit();
}
    </script>
</body>
</html>
